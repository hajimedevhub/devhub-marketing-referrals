<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevHub — Start Your Project</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: #0b1020; color: #e6e8ef; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; color: #111; width: 100%; max-width: 560px; border-radius: 16px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg,#4f6ef7,#8b5cf6); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    p.sub { color: #555; margin: 0 0 20px; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d7dbe4; border-radius: 9px; font-size: 14px; }
    textarea { min-height: 90px; resize: vertical; }
    button { margin-top: 20px; width: 100%; padding: 13px; border: 0; border-radius: 10px; background: linear-gradient(135deg,#4f6ef7,#8b5cf6); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 14px; }
    .msg.ok { color: #0a7d32; }
    .msg.err { color: #c02626; }
    .brand-note { text-align: center; font-size: 12px; color: #888; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark">D</div>
      <strong style="font-size:18px">DevHub</strong>
    </div>
    <h1>Let's build something together</h1>
    <p class="sub">Tell us about your project — our team will reach out within 24 hours.</p>

    <form id="leadForm">
      <label>Full name *</label>
      <input name="name" required />

      <label>Email *</label>
      <input name="email" type="email" required />

      <label>Phone</label>
      <input name="phone" />

      <label>What are you looking for?</label>
      <select name="project_type">
        <option value="">Select…</option>
        <option>Website development</option>
        <option>Web app / SaaS</option>
        <option>Mobile app</option>
        <option>UI/UX design</option>
        <option>Other</option>
      </select>

      <label>Budget range</label>
      <select name="budget">
        <option value="">Select…</option>
        <option>Under $1k</option>
        <option>$1k – $5k</option>
        <option>$5k – $15k</option>
        <option>$15k+</option>
      </select>

      <label>Project details</label>
      <textarea name="message" placeholder="Briefly describe what you need…"></textarea>

      <button type="submit" id="submitBtn">Send to DevHub</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="brand-note">Powered by DevHub</div>
  </div>

  <script>
    const form = document.getElementById('leadForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = ''; msg.className = 'msg';
      btn.disabled = true; btn.textContent = 'Sending…';

      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch('/api/leads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Something went wrong');

        msg.textContent = '✓ Thanks! Your request has been sent to DevHub. We\'ll be in touch shortly.';
        msg.classList.add('ok');
        form.reset();
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add('err');
      } finally {
        btn.disabled = false; btn.textContent = 'Send to DevHub';
      }
    });
  </script>
</body>
</html>
